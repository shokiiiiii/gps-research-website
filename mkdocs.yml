site_name: GPS Co-location Research
site_description: GPS軌跡データで表現される共滞在と都市構造の関係
repo_url: https://github.com/shokiiiiii/gps-research-website
repo_name: gps-research-website
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link

plugins:
  - search:
      lang: ja
  - blog:
      blog_dir: 05_weekly
      blog_toc: true
      post_date_format: yyyy/MM/dd
      post_url_format: "{date}"
      post_excerpt: optional
      archive_name: アーカイブ
      categories_name: カテゴリ
      pagination_per_page: 10
  - mkdocs-jupyter:
      include:
        - "*.ipynb"
      execute: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ホーム: index.md

  - 分析フロー:
      - 全体フロー: 01_workflow/index.md

  - 処理の詳細:
      - 滞在抽出: 02_methodology/stay.md
      - 建物付与: 02_methodology/building.md
      - 共滞在抽出: 02_methodology/costay.md

  - 使用コード:
      - コード一覧: 03_source_code/index.md
      - Stay_region_building: 03_source_code/notebooks/Stay_region_building.ipynb

  - 分析結果:
      - 滞在分析: 04_results/stay.md
      - 建物付与: 04_results/building.md
      - 共滞在分析: 04_results/costay.md

  - 週報:
      - 05_weekly/index.md
